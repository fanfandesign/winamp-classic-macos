name: Build macOS release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build Universal DMG
        run: ./release.sh
      - name: Save distribution files
        uses: actions/upload-artifact@v6
        with:
          name: Winamp-Classic-macOS
          path: |
            dist/*.dmg
            dist/*.sha256
            dist/RELEASE_NOTES.md
          if-no-files-found: error
      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; rebuilt files are available as workflow artifacts."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Winamp Classic $GITHUB_REF_NAME" --notes-file dist/RELEASE_NOTES.md dist/*.dmg dist/*.sha256
          fi
